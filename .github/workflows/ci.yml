name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — typecheck, lint, test
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # niente hook git in CI
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test -- --ci

  # Repository integration tests: ONLY against the Firestore
  # emulator, with a demo-* projectId (no call can reach the cloud).
  app-integration:
    name: App — repositories on Firestore emulator
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # firebase-tools >= 14 requires Java 21+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install (app)
        run: npm ci
        working-directory: app

      # the functions are needed by the export end-to-end: the functions
      # emulator loads the compiled code in lib/
      - name: Install and build (functions)
        run: npm ci && npm run build
        working-directory: functions

      # non-secret functions parameters (model names): without .env
      # the emulator asks for the values and waits
      - name: Functions config from the example
        run: cp functions/.env.example functions/.env

      - name: EPUBCheck (cache)
        id: epubcheck
        uses: actions/cache@v4
        with:
          path: ~/epubcheck
          key: epubcheck-5.3.0

      - name: EPUBCheck (download)
        if: steps.epubcheck.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          mkdir -p ~/epubcheck && unzip -q /tmp/epubcheck.zip -d ~/epubcheck

      - name: Test on emulator (never against real Firebase projects)
        run: >-
          EPUBCHECK_JAR="$HOME/epubcheck/epubcheck-5.3.0/epubcheck.jar"
          npx --yes firebase-tools@14 emulators:exec --only auth,firestore,functions
          --project demo-bookvoice-app
          "npm --prefix app run test:integration"

  # Cloud Functions tests: unit + integration on the Firestore
  # emulator, with EPUBCheck on the generated file.
  functions:
    name: Functions — typecheck, lint, test on emulator
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # firebase-tools >= 14 requires Java 21+ (also enough for EPUBCheck)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci
        working-directory: functions

      - name: Typecheck
        run: npm run typecheck
        working-directory: functions

      - name: Lint
        run: npm run lint
        working-directory: functions

      - name: Unit test
        run: npm test -- --ci
        working-directory: functions

      - name: EPUBCheck (cache)
        id: epubcheck
        uses: actions/cache@v4
        with:
          path: ~/epubcheck
          key: epubcheck-5.3.0

      - name: EPUBCheck (download)
        if: steps.epubcheck.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          mkdir -p ~/epubcheck && unzip -q /tmp/epubcheck.zip -d ~/epubcheck

      - name: Test on emulator (never against real Firebase projects)
        run: >-
          EPUBCHECK_JAR="$HOME/epubcheck/epubcheck-5.3.0/epubcheck.jar"
          npx --yes firebase-tools@14 emulators:exec --only firestore
          --project demo-bookvoice-functions
          "npm --prefix functions run test:integration"

  # Firestore security rules (firestore.rules) with @firebase/rules-unit-testing.
  rules:
    name: Firestore security rules on emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      # firebase-tools >= 14 requires Java 21+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci
        working-directory: rules-tests

      - name: Typecheck
        run: npm run typecheck
        working-directory: rules-tests

      - name: Test on emulator (never against real Firebase projects)
        run: >-
          npx --yes firebase-tools@14 emulators:exec --only firestore
          --project demo-bookvoice
          "npm --prefix rules-tests run test:jest"

  # Not included: EAS build on tag — requires an Expo/EAS account
  # and the EAS_TOKEN secret in the repo.
