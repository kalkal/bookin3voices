name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — typecheck, lint, test
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # niente hook git in CI
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test -- --ci

  # Test d'integrazione dei repository: SOLO contro l'emulatore
  # Firestore, con projectId demo-* (nessuna chiamata può raggiungere il cloud).
  app-integration:
    name: App — repository su emulatore Firestore
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # firebase-tools >= 14 richiede Java 21+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install (app)
        run: npm ci
        working-directory: app

      # le functions servono all'end-to-end dell'export: l'emulatore
      # functions carica il codice compilato in lib/
      - name: Install e build (functions)
        run: npm ci && npm run build
        working-directory: functions

      # parametri non segreti delle functions (nomi dei modelli): senza .env
      # l'emulatore chiede i valori e resta in attesa
      - name: Config functions dall'esempio
        run: cp functions/.env.example functions/.env

      - name: EPUBCheck (cache)
        id: epubcheck
        uses: actions/cache@v4
        with:
          path: ~/epubcheck
          key: epubcheck-5.3.0

      - name: EPUBCheck (download)
        if: steps.epubcheck.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          mkdir -p ~/epubcheck && unzip -q /tmp/epubcheck.zip -d ~/epubcheck

      - name: Test su emulatore (mai contro progetti Firebase reali)
        run: >-
          EPUBCHECK_JAR="$HOME/epubcheck/epubcheck-5.3.0/epubcheck.jar"
          npx --yes firebase-tools@14 emulators:exec --only auth,firestore,functions
          --project demo-bookvoice-app
          "npm --prefix app run test:integration"

  # Test delle Cloud Functions: unit + integrazione su emulatore
  # Firestore, con EPUBCheck sul file generato (stesso motore di Amazon KDP).
  functions:
    name: Functions — typecheck, lint, test su emulatore
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # firebase-tools >= 14 richiede Java 21+ (basta anche per EPUBCheck)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci
        working-directory: functions

      - name: Typecheck
        run: npm run typecheck
        working-directory: functions

      - name: Lint
        run: npm run lint
        working-directory: functions

      - name: Unit test
        run: npm test -- --ci
        working-directory: functions

      - name: EPUBCheck (cache)
        id: epubcheck
        uses: actions/cache@v4
        with:
          path: ~/epubcheck
          key: epubcheck-5.3.0

      - name: EPUBCheck (download)
        if: steps.epubcheck.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          mkdir -p ~/epubcheck && unzip -q /tmp/epubcheck.zip -d ~/epubcheck

      - name: Test su emulatore (mai contro progetti Firebase reali)
        run: >-
          EPUBCHECK_JAR="$HOME/epubcheck/epubcheck-5.3.0/epubcheck.jar"
          npx --yes firebase-tools@14 emulators:exec --only firestore
          --project demo-bookvoice-functions
          "npm --prefix functions run test:integration"

  # Security rules Firestore (firestore.rules) con @firebase/rules-unit-testing.
  rules:
    name: Security rules Firestore su emulatore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      # firebase-tools >= 14 richiede Java 21+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci
        working-directory: rules-tests

      - name: Typecheck
        run: npm run typecheck
        working-directory: rules-tests

      - name: Test su emulatore (mai contro progetti Firebase reali)
        run: >-
          npx --yes firebase-tools@14 emulators:exec --only firestore
          --project demo-bookvoice
          "npm --prefix rules-tests run test:jest"

  # Non incluso: build EAS su tag — richiede un account Expo/EAS
  # e il secret EAS_TOKEN nel repo.
