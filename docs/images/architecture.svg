<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>bookin3voice architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="430" rx="14" fill="#f7f8fa"/>

  <!-- App -->
  <rect x="24" y="70" width="210" height="250" rx="12" fill="#ffffff" stroke="#23607a" stroke-width="2"/>
  <text x="129" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2430">Mobile app</text>
  <text x="129" y="120" text-anchor="middle" font-size="12" fill="#5d6878">Expo · React Native · TypeScript</text>
  <g font-size="13" fill="#1b2430">
    <text x="44" y="156">• Dictate chapters</text>
    <text x="44" y="180">• Edit, offline-first</text>
    <text x="44" y="204">• Pick a writing style</text>
    <text x="44" y="228">• Review AI suggestions</text>
    <text x="44" y="252">• KDP preflight report</text>
    <text x="44" y="276">• Export EPUB / DOCX</text>
  </g>

  <!-- Firebase -->
  <rect x="300" y="40" width="260" height="310" rx="12" fill="#ffffff" stroke="#9a6212" stroke-width="2"/>
  <text x="430" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2430">Firebase</text>
  <rect x="320" y="86" width="220" height="44" rx="8" fill="#f8ecd8"/>
  <text x="430" y="113" text-anchor="middle" font-size="13" fill="#1b2430">Auth (anonymous)</text>
  <rect x="320" y="140" width="220" height="44" rx="8" fill="#f8ecd8"/>
  <text x="430" y="160" text-anchor="middle" font-size="13" fill="#1b2430">Firestore + security rules</text>
  <text x="430" y="176" text-anchor="middle" font-size="11" fill="#5d6878">books · chapters · suggestions</text>
  <rect x="320" y="194" width="220" height="140" rx="8" fill="#f8ecd8"/>
  <text x="430" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Cloud Functions</text>
  <g font-size="12" fill="#1b2430">
    <text x="336" y="240">refineChapter (style suggestions)</text>
    <text x="336" y="260">generateOutline (synopsis → outline)</text>
    <text x="336" y="280">exportBook + KDP preflight</text>
    <text x="336" y="300">exportBackup (Markdown)</text>
    <text x="336" y="320">AiProvider port</text>
  </g>

  <!-- AI -->
  <rect x="626" y="150" width="230" height="74" rx="12" fill="#ffffff" stroke="#2f7a4b" stroke-width="2"/>
  <text x="741" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2430">Amazon Nova Pro</text>
  <text x="741" y="200" text-anchor="middle" font-size="12" fill="#5d6878">Amazon Bedrock · Converse API</text>

  <!-- KDP -->
  <rect x="626" y="60" width="230" height="58" rx="12" fill="#ffffff" stroke="#3b55a0" stroke-width="2"/>
  <text x="741" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Amazon KDP</text>
  <text x="741" y="103" text-anchor="middle" font-size="12" fill="#5d6878">upload the exported EPUB</text>

  <!-- Arrows -->
  <line x1="234" y1="160" x2="318" y2="160" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="276" y="150" text-anchor="middle" font-size="11" fill="#5d6878">sync</text>
  <line x1="234" y1="250" x2="318" y2="250" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="276" y="240" text-anchor="middle" font-size="11" fill="#5d6878">callables</text>
  <path d="M540 320 C 590 320, 590 190, 624 188" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M540 280 C 590 280, 590 90, 624 89" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="596" y="140" text-anchor="middle" font-size="11" fill="#5d6878">EPUB</text>

  <text x="440" y="390" text-anchor="middle" font-size="12" fill="#5d6878">Credentials stay in environment variables or Secret Manager. Local development runs on the Firebase emulators.</text>
</svg>
