# Shared preamble of the E2E flows: clean relaunch of the app in
# E2E mode and handling of the dev client's developer menu.
# Prerequisites (prepared by e2e/run-android.mjs): emulator started, dev client
# dev.kalkal.bookvoice installed, Metro on 8081 with EXPO_PUBLIC_E2E=1 and
# `adb reverse tcp:8081`.
# `stopApp` before the deep link: every flow restarts from a fresh process (and thus
# in-memory state) even when the flows run in sequence.
appId: dev.kalkal.bookvoice
---
- stopApp
# The dev client's deep link loads the E2E bundle served by Metro.
- openLink: "exp+bookvoice://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"

# Wait for the first bundle (download from Metro, wide timeout). On the first
# launch after installation the dev client shows the developer menu in a
# bottom sheet that covers the whole hierarchy: it must be closed before proceeding.
- extendedWaitUntil:
    visible:
      text: 'Continue|CAPITOLO I'
    timeout: 120000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
      # after «Continue» the actual menu stays open: back closes it
      - back

# Initial route in E2E mode: the Dictation of "Capitolo I".
- extendedWaitUntil:
    visible:
      id: "dictation-screen"
    timeout: 30000
