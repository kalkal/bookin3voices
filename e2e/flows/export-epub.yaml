# E2E flow — EPUB export from the Export tab (EXPO_PUBLIC_E2E=1).
# In E2E mode the app is entirely in memory per project (App.tsx): the export is
# served by InMemoryBookExportService/-FileSink and the pending count is
# fixed at 2. The flow covers the «suggerimenti in sospeso» warning, the start of
# generation and the on-screen outcome — without the Emulator Suite or the system
# share sheet. The real exportBook callable (real EPUB) is covered by the Jest
# tests of the Export feature on the Firebase Emulator.
appId: dev.kalkal.bookvoice
name: EPUB export with pending warning
---
- runFlow: ../helpers/open-e2e-app.yaml

# From the initial Dictation to Library → Book → Export tab.
- back
- extendedWaitUntil:
    visible:
      id: "library-screen"
    timeout: 10000
- tapOn:
    id: "library-book-libro-di-prova"
- extendedWaitUntil:
    visible:
      id: "book-screen"
    timeout: 10000
- tapOn:
    id: "book-tab-export"
- extendedWaitUntil:
    visible:
      id: "export-tab"
    timeout: 10000

# Pending warning (2 seeded in App.tsx): it is there and says how many. The scroll
# targets the TEXT, not the card: the card «visible» with just its border in the viewport
# would leave the text below the fold (assertVisible does not scroll).
- scrollUntilVisible:
    element:
      text: "Ci sono 2 suggerimenti in sospeso"
    direction: DOWN
- assertVisible:
    id: "export-pending-warning"

# EPUB is the default format: it is generated and the outcome is awaited
# (fake file: «libro.epub», 5 bytes → «1 KB» rounded down to 1).
- scrollUntilVisible:
    element:
      text: "Genera EPUB"
    direction: DOWN
- tapOn:
    id: "export-generate"
- scrollUntilVisible:
    element:
      text: '«libro\.epub» generato \(1 KB\)\.'
    direction: DOWN
