# E2E flow — dictation with the fake engine (EXPO_PUBLIC_E2E=1).
# Launch and prerequisites in the shared preamble (e2e/helpers/open-e2e-app.yaml).
# Path: open dictation → dictate (Fake's script) → pause → check
# text and word counter. The testIDs are those of the Dictation screen.
appId: dev.kalkal.bookvoice
name: Dictation with FakeDictationEngine
---
- runFlow: ../helpers/open-e2e-app.yaml

# Empty chapter (in-memory repository in E2E mode) and green pre-flight:
# the initial hint is visible and the caption invites to dictate.
- assertVisible:
    id: "dictation-empty-hint"
- extendedWaitUntil:
    visible:
      text: "Tocca il microfono per dettare"
    timeout: 15000

# Dictation start: the fake engine plays the script (2 sentences, 11 words).
- tapOn:
    id: "dictation-mic"
- extendedWaitUntil:
    visible:
      text: "In ascolto.*"
    timeout: 10000

# The consolidated text reaches the screen (last sentence of the script included).
- extendedWaitUntil:
    visible:
      text: '.*La biblioteca profumava di carta antica\..*'
    timeout: 15000

# Pause: dedicated caption, session word counter and saved flush.
- tapOn:
    id: "dictation-mic"
- extendedWaitUntil:
    visible:
      text: "In pausa.*"
    timeout: 10000
- assertVisible:
    text: "11 parole in questa sessione"
- extendedWaitUntil:
    visible:
      text: "Salvato"
    timeout: 10000

# The dictated text is still all there after the pause.
- assertVisible:
    text: 'Il caffè era ancora caldo\. La biblioteca profumava di carta antica\.'
