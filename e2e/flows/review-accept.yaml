# E2E flow — suggestion review (EXPO_PUBLIC_E2E=1).
# Path: Library → Book → seeded chapter «La tazza» (App.tsx, E2E mode)
# → «Rifinisci con AI» with the FakeSuggestionsProvider → in Review the
# style variant B is chosen and accepted, the grammar one is rejected →
# updated text, pending counter at zero. The testIDs are those of the Editor screen;
# the fake provider's suggestion ids are deterministic
# (fake-<hash>-<index>) and are matched via regex on the hash.
appId: dev.kalkal.bookvoice
name: Review — accept a variant, reject a suggestion
---
- runFlow: ../helpers/open-e2e-app.yaml

# From the initial Dictation back up to the Library and open the book.
- back
- extendedWaitUntil:
    visible:
      id: "library-screen"
    timeout: 10000
- tapOn:
    id: "library-book-libro-di-prova"
- extendedWaitUntil:
    visible:
      id: "book-screen"
    timeout: 10000

# The chapter seeded in E2E mode: 11 words, no refinement yet.
- tapOn:
    id: "book-chapter-capitolo-2"
- extendedWaitUntil:
    visible:
      id: "editor-screen"
    timeout: 10000
- assertVisible:
    text: '.*Elena posò lentamente la tazza sul tavolo\..*'

# «Rifinisci con AI»: the fake provider finds 2 suggestions
# (style: «posò lentamente»; grammar: «un altra»).
- tapOn:
    id: "editor-refine"
# the refine panel: whole chapter, all kinds on
- tapOn:
    id: "refine-start"
- extendedWaitUntil:
    visible:
      id: "editor-suggestions-chip"
    timeout: 10000
- assertVisible:
    text: "2 suggerimenti"
- tapOn:
    id: "editor-suggestions-chip"
- extendedWaitUntil:
    visible:
      id: "review-screen"
    timeout: 10000
- assertVisible:
    text: ".*2 in attesa"

# Style card: 3 variants, B («posò, piano,») is chosen and accepted.
- assertVisible:
    text: "3 varianti — tocca per scegliere"
- tapOn:
    id: "review-variant-fake-.*-0-1"
- tapOn:
    id: "review-accept-fake-.*-0"
- assertVisible:
    text: ".*1 in attesa"

# Grammar card («un altra» → «un'altra»): rejected.
- tapOn:
    id: "review-reject-fake-.*-1"
- assertVisible:
    text: ".*0 in attesa"
- assertVisible:
    id: "review-empty"

# Back in the editor: the text reflects the accepted variant, the rejected
# passage is intact and the pending counter is gone.
- tapOn:
    id: "review-back"
- extendedWaitUntil:
    visible:
      id: "editor-screen"
    timeout: 10000
- assertVisible:
    text: '.*Elena posò, piano, la tazza sul tavolo\..*'
- assertVisible:
    text: '.*Prese un altra decisione\..*'
- assertNotVisible:
    id: "editor-suggestions-chip"
